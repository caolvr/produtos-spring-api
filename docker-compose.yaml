version: '3'
services:
  db:
    image: mysql:5.6
    command: mysqld --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: produtos_api
    ports:
      - "3306:3306"
    networks:
      - api_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 45s
      interval: 10s
      retries: 10
  produtos-spring:
    restart: always
    build:
      context: ./
      dockerfile: ./Dockerfile
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    links:
      - db
    depends_on:
        db:
         condition: service_healthy
    networks:
      - api_db
networks:
    api_db:
      driver: bridge
